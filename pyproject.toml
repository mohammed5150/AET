[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "aet"
version = "0.1.0"
description = "Commercial-grade Airfield Ground Lighting (AGL) Engineering Toolkit"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [
    {name = "AET Contributors"},
]
keywords = ["airfield", "ground-lighting", "AGL", "engineering", "toolkit"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "ezdxf>=1.3",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "black>=24.0",
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.11",
    "types-openpyxl>=3.1",
]

[project.scripts]
aet = "aet.ui.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aet"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "BLE",  # flake8-blind-except
    "S",    # flake8-bandit
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "PTH",  # flake8-use-pathlib
    "PT",   # flake8-pytest-style
    "RET",  # flake8-return
    "RUF",  # ruff-specific rules
]
# Deliberately not selected:
#   TC  (flake8-type-checking) — moving model imports into TYPE_CHECKING blocks
#       would break `typing.get_type_hints()` against the domain dataclasses,
#       which the plugin contracts of SDS-002 §10 may legitimately need to
#       resolve at runtime. The import cost it saves does not buy that risk.

[tool.ruff.lint.per-file-ignores]
# An assertion is the point of a test, not a security finding.
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
]

[[tool.mypy.overrides]]
# Tests are checked, but a fixture or stub class need not be fully annotated
# to be worth type-checking for real mistakes.
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

[[tool.mypy.overrides]]
# ezdxf ships py.typed but re-exports its public API implicitly, so strict
# mode rejects the documented `ezdxf.readfile` / `ezdxf.new` entry points.
# Trusting its re-exports is better than reaching into private submodules.
module = ["ezdxf", "ezdxf.*"]
implicit_reexport = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v"

[tool.coverage.run]
source = ["src/aet"]
branch = true

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
